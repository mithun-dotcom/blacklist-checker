services:
  - type: web
    name: arrowinbox-blacklist-checker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPAMHAUS_DQS_KEY   # optional: free Spamhaus DQS key for accurate Spamhaus results
        sync: false
